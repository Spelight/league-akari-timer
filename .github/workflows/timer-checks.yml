name: Timer checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
